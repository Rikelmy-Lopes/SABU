[package]
name = "sabu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ballot Box Bulletin Analysis System"

[workspace]
members = ["sabu_core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dependencies]
eframe = "0.37"
log.workspace = true
rfd = "0.16"
sabu_core = { path = "sabu_core" }
serde_json.workspace = true
simplelog = "0.12"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
